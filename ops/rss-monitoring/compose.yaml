services:
  loki:
    image: grafana/loki:3.7.10
    restart: unless-stopped
    command: -config.file=/etc/loki/rss.yaml
    volumes:
      - ./loki.yaml:/etc/loki/rss.yaml:ro
      - loki-data:/loki
    networks: [monitor-net]
  alloy:
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/rss.alloy"]
    volumes:
      - ./rss.alloy:/etc/alloy/rss.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks: [monitor-net]
volumes:
  loki-data:
  alloy-data:
networks:
  monitor-net:
    external: true
